<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="100%" height="6">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0" />
      <stop offset="25%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#bf4b21" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#bf4b21;#39d353;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#bc8cff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="1.5" width="1200" height="3" rx="1.5" fill="url(#lineGrad)" />
  <rect x="0" y="0.5" width="220" height="5" rx="2.5" fill="url(#pulseGrad)" opacity="0.8">
    <animate attributeName="x" from="-250" to="1250" dur="3.5s" repeatCount="indefinite" />
  </rect>
</svg>
